schema_version: "1.1"
name: retro-positive-feature-done
description: "a finished feature starts retro."
tags: [retro, positive]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "The 001-greeting feature is done and merged. Let's look back on it."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: retro-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(retro)"'
    min: 1
    arm: both
  - name: other-skills-not-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature)"'
    min: 0
    max: 0
    arm: both
