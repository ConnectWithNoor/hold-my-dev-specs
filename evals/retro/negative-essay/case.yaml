schema_version: "1.1"
name: retro-negative-essay
description: "writing feedback starts no skill (D56)."
tags: [retro, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Give me feedback on this paragraph of my essay: \"Cities are loud. But they are also full of life.\""
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
