schema_version: "1.1"
name: retro-negative-book
description: "\"what can I learn\" about a book starts no skill (D56)."
tags: [retro, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What can I learn from the first chapter of Meditations by Marcus Aurelius?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
