schema_version: "1.1"
name: retro-negative-what-is-retro
description: "a learning question about retros starts no skill."
tags: [retro, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Explain what a retrospective is in agile teams."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
