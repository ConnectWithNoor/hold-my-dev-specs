schema_version: "1.1"
name: retro-positive-what-can-we-learn
description: "\"what can we learn\" after a feature starts retro."
tags: [retro, positive]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What can we learn from this last feature?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: retro-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(retro)"'
    min: 1
    arm: both
  - name: other-skills-not-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature)"'
    min: 0
    max: 0
    arm: both
