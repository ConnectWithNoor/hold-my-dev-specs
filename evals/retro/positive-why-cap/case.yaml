schema_version: "1.1"
name: retro-positive-why-cap
description: "the round-cap trigger starts retro (break-loop)."
tags: [retro, positive]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "T01 hit the fix-round cap three times before it passed. Why did that happen, and how do we stop it next time?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: retro-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(retro)"'
    min: 1
    arm: both
  - name: other-skills-not-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature)"'
    min: 0
    max: 0
    arm: both
