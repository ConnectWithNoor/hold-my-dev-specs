schema_version: "1.1"
name: feature-negative-explain-code
description: "explaining code without changing it starts no skill."
tags: [feature, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What does index.js in this repo do? Just explain it, no changes."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
