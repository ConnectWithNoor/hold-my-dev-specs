schema_version: "1.1"
name: feature-negative-photo-caption
description: "editing a caption starts no skill (D56)."
tags: [feature, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Edit this photo caption so it reads better: 'sunst at the beech, me and my dog'"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
