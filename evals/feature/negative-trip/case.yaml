schema_version: "1.1"
name: feature-negative-trip
description: "trip planning starts no skill, even in a configured repo (D56)."
tags: [feature, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Help me plan a three-day trip to Lisbon."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
