schema_version: "1.1"
name: feature-positive-build
description: "\"build X\" in a configured repo starts feature."
tags: [feature, positive]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Add a function that reverses a string, with tests."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: feature-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(feature)"'
    min: 1
    arm: both
  - name: other-skills-not-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|retro)"'
    min: 0
    max: 0
    arm: both
