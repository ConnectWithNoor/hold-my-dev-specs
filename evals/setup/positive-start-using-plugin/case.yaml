schema_version: "1.1"
name: setup-positive-start-using-plugin
description: "naming the plugin in a repo without settings starts setup."
tags: [setup, positive]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "I want to start using hold-my-dev-specs in this project."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: setup-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup)"'
    min: 1
    arm: both
  - name: other-skills-not-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(feature|retro)"'
    min: 0
    max: 0
    arm: both
