schema_version: "1.1"
name: setup-negative-what-is-sdd
description: "a discussion about the method starts no skill."
tags: [setup, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "What does spec-driven development mean, and why would anyone use it?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
