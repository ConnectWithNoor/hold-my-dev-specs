schema_version: "1.1"
name: setup-negative-hash-table
description: "a learning question starts no skill (D56)."
tags: [setup, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Explain what a hash table is, in simple words."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
