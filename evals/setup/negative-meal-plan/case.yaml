schema_version: "1.1"
name: setup-negative-meal-plan
description: "\"set up\" outside software starts no skill (D56)."
tags: [setup, negative]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Help me set up a weekly meal plan for a family of four."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: no-plugin-skill-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup|feature|retro)"'
    min: 0
    max: 0
    arm: both
