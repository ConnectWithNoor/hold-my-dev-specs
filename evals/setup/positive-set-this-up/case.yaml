schema_version: "1.1"
name: setup-positive-set-this-up
description: "\"set this up\" in a repo without settings starts setup."
tags: [setup, positive]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Set this up for my repo so we can build it spec-driven."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: setup-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup)"'
    min: 1
    arm: both
  - name: other-skills-not-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(feature|retro)"'
    min: 0
    max: 0
    arm: both
