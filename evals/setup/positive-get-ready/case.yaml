schema_version: "1.1"
name: setup-positive-get-ready
description: "describing the workflow in a repo without settings starts setup."
tags: [setup, positive]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Get this codebase ready so new features go through a spec and plan I approve first."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: setup-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(setup)"'
    min: 1
    arm: both
  - name: other-skills-not-started
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:hold-my-dev-specs:)?(feature|retro)"'
    min: 0
    max: 0
    arm: both
